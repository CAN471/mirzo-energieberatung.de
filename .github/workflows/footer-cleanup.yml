name: One-time footer cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/footer-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove obsolete footer blocks
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          def remove_balanced(html, marker, tag):
              count = html.count(marker)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one {marker!r}, found {count}")
              start = html.index(marker)
              pattern = re.compile(rf"<{tag}\\b[^>]*>|</{tag}\\s*>", re.I)
              depth = 0
              for match in pattern.finditer(html, start):
                  token = match.group(0).lower()
                  if token.startswith(f"<{tag}") and not token.startswith(f"</{tag}"):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return html[:start] + html[match.end():]
              raise RuntimeError(f"Could not find closing {tag} for {marker!r}")

          targets = [
              ('<form class="framer-p9blxb">', "form"),
              ('<div class="framer-8c1gx3" data-framer-name="Social">', "div"),
              ('<div class="framer-1x9kfky" data-framer-name="About">', "div"),
              ('<div class="framer-1su39qg" data-framer-name="Right">', "div"),
          ]

          for marker, tag in targets:
              html = remove_balanced(html, marker, tag)

          # Framer hydrates the exported markup client-side. Keep a tiny CSS guard so
          # these deleted component instances cannot flash back into view after hydration.
          guard = '''<style id="mirzo-footer-cleanup">
          .framer-p9blxb,
          .framer-8c1gx3[data-framer-name="Social"],
          .framer-1x9kfky[data-framer-name="About"],
          .framer-1su39qg[data-framer-name="Right"] { display: none !important; }
          </style>'''
          if 'id="mirzo-footer-cleanup"' not in html:
              html = html.replace("</head>", guard + "</head>", 1)

          forbidden = [
              'placeholder="Bleib auf dem laufenden!"',
              '>Twitter (X)<',
              '>Instagram<',
              '>Youtube<',
              '>Terms &amp; Conditions<',
              '>Privacy Policy<',
              '<div class="framer-1x9kfky" data-framer-name="About">',
          ]
          leftovers = [item for item in forbidden if item in html]
          if leftovers:
              raise RuntimeError(f"Cleanup verification failed; leftovers: {leftovers}")

          path.write_text(html, encoding="utf-8")

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Clean up homepage footer"
          git push
