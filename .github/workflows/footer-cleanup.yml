name: One-time footer cleanup

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Remove requested homepage/footer sections
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          def remove_balanced(source, marker, tag):
              count = source.count(marker)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one {marker!r}, found {count}")
              start = source.index(marker)
              pattern = re.compile(rf"<{tag}\b[^>]*>|</{tag}\s*>", re.I)
              depth = 0
              for match in pattern.finditer(source, start):
                  token = match.group(0).lower()
                  if not token.startswith(f"</{tag}"):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return source[:start] + source[match.end():]
              raise RuntimeError(f"Could not find closing {tag} for {marker!r}")

          targets = [
              ('<form class="framer-p9blxb">', "form"),
              ('<div class="framer-8c1gx3" data-framer-name="Social">', "div"),
              ('<div class="framer-1x9kfky" data-framer-name="About">', "div"),
              ('<div class="framer-1su39qg" data-framer-name="Right">', "div"),
          ]

          for marker, tag in targets:
              html = remove_balanced(html, marker, tag)

          # Framer hydrates the static export. This guard prevents the removed
          # component instances from being rendered back into view client-side.
          guard = '''<style id="mirzo-footer-cleanup">
          .framer-p9blxb,
          .framer-8c1gx3[data-framer-name="Social"],
          .framer-1x9kfky[data-framer-name="About"],
          .framer-1su39qg[data-framer-name="Right"] { display: none !important; }
          </style>'''
          if 'id="mirzo-footer-cleanup"' not in html:
              html = html.replace("</head>", guard + "</head>", 1)

          forbidden = [
              'placeholder="Bleib auf dem laufenden!"',
              '>Twitter (X)<',
              '>Instagram<',
              '>Youtube<',
              '>Terms &amp; Conditions<',
              '>Privacy Policy<',
              '<div class="framer-1x9kfky" data-framer-name="About">',
          ]
          leftovers = [item for item in forbidden if item in html]
          if leftovers:
              raise RuntimeError(f"Cleanup verification failed; leftovers: {leftovers}")

          path.write_text(html, encoding="utf-8")

      - name: Commit result and remove one-time workflow
        run: |
          rm .github/workflows/footer-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/footer-cleanup.yml
          git commit -m "Remove obsolete homepage footer sections"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
