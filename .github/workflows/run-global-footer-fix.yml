name: Run global footer fix

on:
  push:
    branches:
      - agent/global-footer-placeholder-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/global-footer-placeholder-fix
          fetch-depth: 0

      - name: Apply transform
        run: python3 .github/scripts/apply_global_footer_fix.py

      - name: Commit transformed export
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/.global-footer-trigger
          git rm -f .github/workflows/global-footer-placeholder-fix.yml
          git rm -f .github/workflows/run-global-footer-fix.yml
          git rm -f .github/scripts/apply_global_footer_fix.py
          git add index.html about/index.html privacy-policy/index.html terms-conditions/index.html
          git commit -m "Apply footer branding and preview fix site-wide"
          git push
