name: One-time About player hard removal

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Hard-hide obsolete About player
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('about/index.html')
          text = page.read_text(encoding='utf-8')
          marker = 'id="mirzo-about-player-hard-kill"'

          if marker not in text:
              css = '''<style id="mirzo-about-player-hard-kill">
/* Remove the obsolete Framer YouTube preview section on /about. */
.framer-1kehpu3[data-framer-name="Bottom"] {
  display: none !important;
  visibility: hidden !important;
  pointer-events: none !important;
  width: 0 !important;
  height: 0 !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
}
</style>'''
              if '</head>' not in text:
                  raise SystemExit('Missing </head>')
              text = text.replace('</head>', css + '</head>', 1)

          pattern = re.compile(r'(<div class="framer-1kehpu3"[^>]*\bstyle=")([^"]*)(")')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected one hero Bottom container, found {len(matches)}')

          def repl(m):
              style = m.group(2)
              if 'display:none!important' not in style.replace(' ', ''):
                  style = 'display:none!important;visibility:hidden!important;height:0!important;' + style
              return m.group(1) + style + m.group(3)

          text = pattern.sub(repl, text, count=1)
          page.write_text(text, encoding='utf-8')

          final = page.read_text(encoding='utf-8')
          if final.count(marker) != 1:
              raise SystemExit('Hard-kill marker validation failed')
          if 'class="framer-1kehpu3"' not in final or 'display:none!important' not in final:
              raise SystemExit('Hero Bottom hard-hide validation failed')
          PY

      - name: Commit clean result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/.hard-remove-about-player-main-trigger .github/.execute-about-player-hard-kill
          git rm -f .github/workflows/hard-remove-about-player-main.yml
          git add -A about/index.html .github
          git commit -m "Hard-remove obsolete About YouTube player"
          git push

      - name: Deploy the transformed main revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches \
            -d '{"ref":"main"}'
