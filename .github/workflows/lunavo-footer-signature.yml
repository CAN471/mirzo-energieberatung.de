name: One-time Lunavo footer signature

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Upgrade Lunavo footer signature
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'id="mirzo-preview-footer-overrides-css"' not in html:
              raise RuntimeError("Existing footer override style not found")
          if 'brand.innerHTML = "<span>Website by</span><strong>lunavo.media</strong>";' not in html:
              raise RuntimeError("Existing Lunavo branding markup not found")

          style = '''<style id="mirzo-preview-footer-overrides-css">
          /* Keep the decorative Framer preview visible, but make it inert. */
          #1jsse1n {
            pointer-events: auto !important;
            cursor: default !important;
          }
          #1jsse1n * {
            pointer-events: none !important;
            cursor: default !important;
          }

          /* Lunavo Media studio signature */
          #lunavo-footer-brand {
            position: relative;
            isolation: isolate;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 6px 12px 6px 7px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.025) 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 10px 32px rgba(0, 0, 0, 0.22);
            color: #fff;
            font-family: "DM Sans", "DM Sans Placeholder", sans-serif;
            text-decoration: none;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease, background 220ms ease;
          }

          #lunavo-footer-brand::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.12) 48%, transparent 66%);
            transform: translateX(-125%);
            transition: transform 650ms cubic-bezier(.2,.8,.2,1);
          }

          #lunavo-footer-brand:hover {
            transform: translateY(-2px);
            border-color: rgba(77, 140, 255, 0.34);
            background: linear-gradient(180deg, rgba(0, 85, 255, 0.11) 0%, rgba(255, 255, 255, 0.03) 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 12px 34px rgba(0, 85, 255, 0.16);
          }

          #lunavo-footer-brand:hover::before {
            transform: translateX(125%);
          }

          #lunavo-footer-brand .lunavo-mark {
            position: relative;
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 22%, rgb(99, 157, 255) 0%, rgb(0, 85, 255) 52%, rgb(0, 45, 145) 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 0 20px rgba(0, 85, 255, 0.30);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
          }

          #lunavo-footer-brand .lunavo-mark::after {
            content: "";
            position: absolute;
            width: 5px;
            height: 5px;
            right: -1px;
            top: -1px;
            border: 2px solid rgb(8, 8, 8);
            border-radius: 50%;
            background: rgb(104, 255, 178);
            box-shadow: 0 0 9px rgba(104, 255, 178, 0.65);
          }

          #lunavo-footer-brand .lunavo-copy {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1px;
            min-width: 0;
          }

          #lunavo-footer-brand .lunavo-kicker {
            color: rgba(255, 255, 255, 0.38);
            font-size: 8px;
            line-height: 10px;
            font-weight: 600;
            letter-spacing: 0.95px;
            white-space: nowrap;
          }

          #lunavo-footer-brand .lunavo-name {
            color: rgba(255, 255, 255, 0.88);
            font-size: 11px;
            line-height: 14px;
            font-weight: 700;
            letter-spacing: 0.72px;
            white-space: nowrap;
            transition: color 220ms ease;
          }

          #lunavo-footer-brand .lunavo-arrow {
            color: rgba(255, 255, 255, 0.34);
            font-size: 13px;
            line-height: 1;
            transform: translate(0, 0);
            transition: color 220ms ease, transform 220ms ease;
          }

          #lunavo-footer-brand:hover .lunavo-name {
            color: #fff;
          }

          #lunavo-footer-brand:hover .lunavo-arrow {
            color: rgb(126, 169, 255);
            transform: translate(2px, -2px);
          }

          @media (max-width: 809.98px) {
            #lunavo-footer-brand {
              min-height: 38px;
              gap: 8px;
              padding: 5px 10px 5px 6px;
            }
            #lunavo-footer-brand .lunavo-mark {
              width: 25px;
              height: 25px;
              flex-basis: 25px;
              font-size: 11px;
            }
            #lunavo-footer-brand .lunavo-kicker {
              display: none;
            }
            #lunavo-footer-brand .lunavo-name {
              font-size: 10px;
              letter-spacing: 0.62px;
            }
          }
          </style>'''

          html, count = re.subn(
              r'<style id="mirzo-preview-footer-overrides-css">.*?</style>',
              style,
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f"Expected one style replacement, got {count}")

          html = html.replace(
              'brand.setAttribute("aria-label", "Website by lunavo.media");',
              'brand.setAttribute("aria-label", "Digital experience by Lunavo Media");',
              1,
          )
          html = html.replace(
              'brand.innerHTML = "<span>Website by</span><strong>lunavo.media</strong>";',
              'brand.innerHTML = "<span class=\\"lunavo-mark\\" aria-hidden=\\"true\\">L</span><span class=\\"lunavo-copy\\"><span class=\\"lunavo-kicker\\">DIGITAL EXPERIENCE BY</span><strong class=\\"lunavo-name\\">LUNAVO MEDIA</strong></span><span class=\\"lunavo-arrow\\" aria-hidden=\\"true\\">↗</span>";',
              1,
          )

          required = [
              'DIGITAL EXPERIENCE BY',
              'LUNAVO MEDIA',
              'class=\\"lunavo-mark\\"',
              'class=\\"lunavo-arrow\\"',
              'rgba(104, 255, 178',
              'Digital experience by Lunavo Media',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise RuntimeError(f"Verification failed: {missing}")

          path.write_text(html, encoding="utf-8")

      - name: Commit result and remove one-time workflow
        run: |
          rm .github/workflows/lunavo-footer-signature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/lunavo-footer-signature.yml
          git commit -m "Upgrade Lunavo footer signature"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
